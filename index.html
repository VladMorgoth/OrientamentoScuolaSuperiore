function render() {
    const app = document.getElementById('app');
    if (currentStep === -1) {
        renderWelcome(app);
    } else if (currentStep < QUESTIONS.length) {
        renderQuestion(app, QUESTIONS[currentStep]);
    } else {
        renderResults(app);
    }
}

function renderWelcome(app) {
    app.innerHTML = `

            </p>
            <button class="btn btn-primary" onclick="currentStep=0; render();">
                Iniziamo! \u{27A1}️
            </button>
        </div>
    `;
}

function renderQuestion(app, q) {
    const progress = ((currentStep) / QUESTIONS.length * 100).toFixed(0);
    let contentHtml = '';
    if (q.type === 'multi') {
        contentHtml = renderMultiOptions(q);
    } else {
        contentHtml = renderRatingOptions(q);
    }
    const canProceed = checkCanProceed(q);
    app.innerHTML = `
        <div class="progress-text">Domanda ${currentStep + 1} di ${QUESTIONS.length}</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${progress}%"></div>

            <button class="btn btn-secondary" onclick="goBack()">

            </button>

                ${currentStep === QUESTIONS.length - 1 ? 'Scopri i risultati \u{1F389}' : 'Avanti \u{27A1}️'}

}

function renderMultiOptions(q) {
    const selected = answers[q.id] || [];
    return q.options.map((opt, i) => {
        const isSel = selected.includes(i);
        const cls = 'option' + (isSel ? ' selected' : '');
        return `
            <div class="${cls}" onclick="selectMulti('${q.id}', ${i}, ${q.maxSelect || 99})">
                <div class="check"></div>
                <span class="emoji">${opt.emoji}</span>
                <span class="label">${opt.label}</span>
            </div>
        `;
    }).join('');
}

function renderRatingOptions(q) {
    const ratings = answers[q.id] || {};
    let legendHtml = `
        <div class="rating-legend desktop-legend">
            ${RATING_LABELS.map(r => `<span>${r.short}</span>`).join('')}
        </div>
        <div class="rating-legend-mobile">
            ${RATING_LABELS.map((r, i) => {
                const colors = ['#E57373','#FFB74D','#B0B8D9','#81C784','#5B6ABF'];
                return `<span class="legend-item"><span class="legend-dot" style="background:${colors[i]}">${r.mini}</span>${r.text}</span>`;
            }).join('')}
        </div>
    `;
    let rowsHtml = q.options.map((opt, i) => {
        const val = ratings[i];
        const isRated = val !== undefined;
        return `
            <div class="rating-row ${isRated ? 'rated' : ''}">
                <div class="row-label">
                    <span class="emoji">${opt.emoji}</span>
                    <span class="label-text">${opt.label}</span>
                </div>
                <div class="rating-pills">
                    ${RATING_LABELS.map((r, rv) => `
                        <div class="pill ${val === rv ? 'active' : ''}"
                             data-val="${rv}"
                             onclick="setRating('${q.id}', ${i}, ${rv})">
                            <span class="pill-full">${r.short}</span>
                            <span class="pill-mini">${r.mini}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }).join('');
    return legendHtml + rowsHtml;
}

function checkCanProceed(q) {
    if (q.type === 'multi') {
        const selected = answers[q.id] || [];
        return selected.length > 0;
    } else {
        const ratings = answers[q.id] || {};
        return Object.keys(ratings).length === q.options.length;
    }
}

function selectMulti(qId, idx, maxSelect) {
    if (!answers[qId]) answers[qId] = [];
    const pos = answers[qId].indexOf(idx);
    if (pos >= 0) {
        answers[qId].splice(pos, 1);
    } else if (answers[qId].length < maxSelect) {
        answers[qId].push(idx);
    }
    render();
}

function setRating(qId, optIdx, val) {
    if (!answers[qId]) answers[qId] = {};
    answers[qId][optIdx] = val;
    render();
}

function goBack() {
    if (currentStep > 0) currentStep--;
    else currentStep = -1;
    render();
    window.scrollTo(0, 0);
}

function goNext() {
    const q = QUESTIONS[currentStep];
    if (!checkCanProceed(q)) return;
    currentStep++;
    render();
    window.scrollTo(0, 0);
}

function calculateScores() {
    let userProfile = {};
    for (const q of QUESTIONS) {
        if (q.type === 'multi') {
            const selectedIdxs = answers[q.id] || [];
            for (const idx of selectedIdxs) {
                const opt = q.options[idx];
                for (const [key, val] of Object.entries(opt.keys)) {
                    userProfile[key] = (userProfile[key] || 0) + val;
                }
            }
        } else {
            const ratings = answers[q.id] || {};
            for (const [idxStr, ratingVal] of Object.entries(ratings)) {
                const opt = q.options[parseInt(idxStr)];
                const factor = ratingVal / 4;
                for (const [key, val] of Object.entries(opt.keys)) {
                    userProfile[key] = (userProfile[key] || 0) + val * factor;
                }
            }
        }
    }

    let results = SCHOOLS.map(school => {
        let score = 0;
        let maxPossible = 0;
        for (const [key, weight] of Object.entries(school.weights)) {
            if (weight > 0) {
                const userVal = userProfile[key] || 0;
                score += userVal * weight;
                maxPossible += 5 * weight;
            }
        }
        const percent = maxPossible > 0 ? Math.round((score / maxPossible) * 100) : 0;
        return { ...school, score, percent: Math.min(percent, 99) };
    });

    results.sort((a, b) => b.percent - a.percent);
    const topScore = results[0].percent;
    if (topScore < 50) {
        const boost = 55 - topScore;
        results = results.map(r => ({ ...r, percent: Math.min(r.percent + boost, 99) }));
    }
    return results;
}

function getAnswersSummary() {
    let summary = [];
    for (const q of QUESTIONS) {
        let qSummary = { question: q.text, answers: [] };
        if (q.type === 'multi') {
            const selected = answers[q.id] || [];
            for (const idx of selected) {
                qSummary.answers.push({ text: q.options[idx].label, value: 'Selezionato' });
            }
        } else {
            const ratings = answers[q.id] || {};
            for (const [idxStr, ratingVal] of Object.entries(ratings)) {
                const opt = q.options[parseInt(idxStr)];
                qSummary.answers.push({ text: opt.label, value: RATING_LABELS[ratingVal].text });
            }
        }
        summary.push(qSummary);
    }
    return summary;
}

function downloadPDF() {
    showLoading('Generazione PDF in corso...');

    setTimeout(() => {
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageW = 210;
            const margin = 18;
            const contentW = pageW - margin * 2;
            let y = 20;

            function checkPage(needed) {
                if (y + needed > 275) {
                    doc.addPage();
                    y = 20;
                }
            }

            // Header
            doc.setFillColor(91, 106, 191);
            doc.rect(0, 0, pageW, 32, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text('Quale Scuola Superiore a Sondrio?', pageW / 2, 15, { align: 'center' });
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text('Risultati del questionario di orientamento', pageW / 2, 23, { align: 'center' });

            const now = new Date();
            doc.setFontSize(8);
            doc.text('Data: ' + now.toLocaleDateString('it-IT') + ' ' + now.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}), pageW / 2, 29, { align: 'center' });

            y = 42;

            // Section: Risposte
            doc.setTextColor(61, 74, 138);
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('Le tue risposte', margin, y);
            y += 3;
            doc.setDrawColor(91, 106, 191);
            doc.setLineWidth(0.5);
            doc.line(margin, y, margin + contentW, y);
            y += 8;

            const answersSummary = getAnswersSummary();
            for (const qs of answersSummary) {
                checkPage(20);
                doc.setTextColor(45, 49, 66);
                doc.setFontSize(10);
                doc.setFont('helvetica', 'bold');
                const qLines = doc.splitTextToSize(qs.question, contentW);
                doc.text(qLines, margin, y);
                y += qLines.length * 5 + 2;

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                for (const a of qs.answers) {
                    checkPage(8);
                    doc.setTextColor(107, 114, 128);
                    const ansLine = '  • ' + a.text + (a.value !== 'Selezionato' ? '  →  ' + a.value : '');
                    const aLines = doc.splitTextToSize(ansLine, contentW - 4);
                    doc.text(aLines, margin + 2, y);
                    y += aLines.length * 4.5;
                }
                y += 5;
            }

            // Section: Risultati
            checkPage(30);
            y += 4;
            doc.setTextColor(61, 74, 138);
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('Classifica di affinita', margin, y);
            y += 3;
            doc.setDrawColor(91, 106, 191);
            doc.line(margin, y, margin + contentW, y);
            y += 8;

            const results = lastResults || calculateScores();
            const barColors = [
                [245, 166, 35], [148, 163, 184], [205, 127, 50],
                [91, 106, 191], [91, 106, 191], [91, 106, 191],
                [91, 106, 191], [91, 106, 191], [91, 106, 191], [91, 106, 191]
            ];
            const medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}'];

            for (let i = 0; i < results.length; i++) {
                const s = results[i];
                checkPage(22);

                // Rank + Name
                doc.setTextColor(45, 49, 66);
                doc.setFontSize(11);
                doc.setFont('helvetica', 'bold');
                const prefix = (i < 3 ? (i+1) + '.' : (i+1) + '.');
                doc.text(prefix, margin, y);
                doc.text(s.name, margin + 8, y);

                // Percentage
                doc.setTextColor(91, 106, 191);
                doc.setFontSize(13);
                doc.text(s.percent + '%', pageW - margin, y, { align: 'right' });

                y += 3;

                // Bar background
                doc.setFillColor(226, 230, 239);
                doc.roundedRect(margin + 8, y, contentW - 8, 5, 2, 2, 'F');

                // Bar fill
                const barW = (contentW - 8) * s.percent / 100;
                const clr = barColors[i] || barColors[3];
                doc.setFillColor(clr[0], clr[1], clr[2]);
                if (barW > 0) doc.roundedRect(margin + 8, y, barW, 5, 2, 2, 'F');

                y += 7;

                // Type
                doc.setTextColor(107, 114, 128);
                doc.setFontSize(8);
                doc.setFont('helvetica', 'normal');
                doc.text(s.type + '  |  ' + s.tags.join(', '), margin + 8, y);
                y += 8;
            }

            // Footer
            checkPage(15);
            y += 5;
            doc.setDrawColor(200, 200, 200);
            doc.line(margin, y, margin + contentW, y);
            y += 6;
            doc.setTextColor(156, 163, 175);
            doc.setFontSize(7.5);
            doc.setFont('helvetica', 'italic');
            doc.text('Questo test e\' puramente indicativo e pensato per divertirsi.', pageW / 2, y, { align: 'center' });
            y += 4;
            doc.text('Per una scelta consapevole, visita gli open day delle scuole e parlane con insegnanti e orientatori.', pageW / 2, y, { align: 'center' });

            doc.save('Scelta_Scuola_Sondrio.pdf');
        } catch (err) {
            alert('Errore nella generazione del PDF. Verifica la connessione internet per il caricamento delle librerie.');
            console.error(err);
        }
        hideLoading();
    }, 100);
}

function shareWhatsApp() {
    showLoading('Preparazione immagine...');

    const resultsEl = document.getElementById('results-area');

    setTimeout(() => {
        html2canvas(resultsEl, {
            scale: 2,
            backgroundColor: '#F4F6FB',
            useCORS: true,
            logging: false
        }).then(canvas => {
            canvas.toBlob(blob => {
                hideLoading();

                if (navigator.canShare && navigator.canShare({ files: [new File([blob], 'risultati.png', { type: 'image/png' })] })) {
                    const file = new File([blob], 'Scelta_Scuola_Sondrio.png', { type: 'image/png' });
                    navigator.share({
                        title: 'I miei risultati - Scuola Superiore Sondrio',
                        text: buildShareText(),
                        files: [file]
                    }).catch(() => {
                        fallbackWhatsApp(canvas);
                    });
                } else {
                    fallbackWhatsApp(canvas);
                }
            }, 'image/png');
        }).catch(() => {
            hideLoading();
            fallbackWhatsAppText();
        });
    }, 200);
}

function buildShareText() {
    const results = lastResults || calculateScores();
    let text = 'Ecco i miei risultati del test "Quale Scuola Superiore a Sondrio?"\n\n';
    for (let i = 0; i < Math.min(5, results.length); i++) {
        const s = results[i];
        const medal = i === 0 ? '\u{1F947}' : i === 1 ? '\u{1F948}' : i === 2 ? '\u{1F949}' : '  ';
        text += `${medal} ${s.percent}% - ${s.name}\n`;
    }
    text += '\nScopri anche tu la tua scuola ideale!';
    return text;
}

function fallbackWhatsApp(canvas) {
    const link = document.createElement('a');
    link.download = 'Scelta_Scuola_Sondrio.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    setTimeout(() => {
        const text = encodeURIComponent(buildShareText());
        window.open('https://wa.me/?text=' + text, '_blank');
    }, 500);
}

function fallbackWhatsAppText() {
    const text = encodeURIComponent(buildShareText());
    window.open('https://wa.me/?text=' + text, '_blank');
}

function restart() {
    currentStep = -1;
    answers = {};
    lastResults = null;
    render();
    window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
